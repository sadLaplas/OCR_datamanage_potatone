[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docmanage"
version = "0.1.0"
description = "Стартовая основа проекта анализа документов."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "pypdf>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
docmanage = "docmanage.cli:main"

[tool.setuptools]
packages = ["docmanage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
